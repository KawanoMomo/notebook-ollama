[project]
name = "notebook-ollama"
version = "0.1.0"
description = "Local NotebookLM-like personal knowledge base over Ollama with MCP exposure"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "anyio>=4.6",
    "structlog>=24.4",
    "tenacity>=9.0",
    "python-ulid>=3.0",
    "tiktoken>=0.8",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "markdown-it-py>=3.0",
    "trafilatura>=1.12",
    "qdrant-client>=1.12",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1",
    "mcp[cli]>=1.0",
    "pyyaml>=6.0",
    "truststore>=0.10",
    # psutil is used by core/crash_reporter/hardware.py (CPU cores / RAM / disk)
    # and by core/crash_reporter/lifecycle.py (running.lock PID liveness check).
    # Must be in core dependencies, not the optional `recording` extra, because
    # the crash reporter ships in the base install.
    "psutil>=5.9",
]

# Optional dependency: AGPL-3.0 licensed. The core project ships under MIT
# (see LICENSE). Installing this extra opts the user into the AGPL terms for
# PyMuPDF itself.
[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
# PPTX→PDF 変換(発表モード, spec §5/§8)。COM 経由で PowerPoint を操作するため
# Windows 限定・PowerPoint インストール前提。未インストールでも取込自体は
# 通常どおり動作し、スライド表示 (has_slides) だけが false のままになる。
slides = ["pywin32>=306; sys_platform == 'win32'"]
# Recording / live-caption / diarization stack (Sprint 2+ of the recording-source
# feature). Heavy, GPU-capable (CUDA via ctranslate2 pulled in by faster-whisper).
# All third-party; documented in LICENSE-THIRDPARTY.md. STT/diarization MODELS are
# NOT shipped — they are fetched/reused separately and gitignored.
recording = [
    "faster-whisper>=1.0.3",
    # Pin ctranslate2 to 4.7.2: this is the version proven to work on GPU on the
    # target machine (matches the meeting-transcriber venv). ctranslate2 4.8.0
    # fails to load cublas64_12.dll on this CUDA stack and silently drops to CPU.
    "ctranslate2==4.7.2",
    "pyaudiowpatch>=0.2.12",
    # sherpa-onnx 1.13.3 split the native runtime into the `sherpa-onnx-core`
    # package whose bundled ONNX Runtime can read the pyannote segmentation-3.0
    # model (format v24). The monolithic 1.13.2 cp312 wheel statically links an
    # old ORT 1.17.1 (format API<=17) and fails to load that model. Pin both so
    # the native core is always present.
    "sherpa-onnx==1.13.3",
    "sherpa-onnx-core==1.13.3",
    "soundfile>=0.12",
    "scipy>=1.11",
    "webrtcvad-wheels>=2.0",
    "numpy>=1.26",
    # CUDA runtime libraries for ctranslate2/faster-whisper GPU inference on
    # Windows+NVIDIA. Without these, cublas64_12.dll/cudnn are not found and
    # STT silently falls back to CPU (too slow for live captions). Resolved by
    # the inlined _register_cuda_dll_dirs() in core/recording/transcriber.py.
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9.0",
]
# 視覚埋め込み (Stage 3)。Ollama非対応のためtransformersスタックで実行する
# (ADRドラフト: visual-embedding-ondemand-transformers)。CUDA無し環境でもCPUで動く。
visual = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.49",
    "sentence-transformers>=3.3",
    "pillow>=10.0",
]
# 検索精度のオフライン評価 (spec: 2026-08-07-ragas-retrieval-eval-design.md)。
# 開発者向け実験ツール専用で、本番インストールには含めない。Ragas は
# メトリクス計算にのみ使い、フレームワーク全体には乗らない。
#
# langchain-community<0.4: ragas 0.4.3 は langchain_community.chat_models.vertexai を
#   無条件 import するが、この module は langchain-community 0.4.x で削除された
#   (ragas 側が版を固定していない上流バグ)。langchain* は ragas 経由の推移的依存
#   のみで本体コードは使っていないため、この降格は eval extra 内で閉じる。
# rapidfuzz: NonLLMContextRecall が内部で使う NonLLMStringSimilarity の要求。
#   ragas は依存に含めていないので明示的に足す。
eval = ["ragas>=0.2", "langchain-community<0.4", "rapidfuzz>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",
    # PyMuPDF kept in dev so the fixture generators and parser tests can run.
    # Production install must opt-in via `pip install '.[pdf]'`.
    "pymupdf>=1.24",
    # Property-based testing for the crash-reporter PII redactor (spec §11.1).
    # Fuzzes nested dict shapes against the recursive-walk invariant: no
    # forbidden key may appear in the output at any depth.
    "hypothesis>=6.100",
]

[tool.uv]
package = true

# PyTorch CUDA ホイール用インデックス (Stage 4)。
# PyPI の Windows 向け torch は CPU 専用ビルド (torch.__version__ == "2.13.0+cpu",
# torch.version.cuda is None) で、RTX 2080 Ti があっても視覚埋め込みが CPU 実行に
# なる(実測 約95秒/ページ)。download.pytorch.org の CUDA 版インデックスを
# 明示指定してGPUを使う。
# cu130 = CUDA 13.0。PyTorch の Windows ビルド設定 (.ci/pytorch/windows/
# build_env_setup.py の TORCH_CUDA_ARCH_LIST_TABLE) が "7.5;8.0;8.6;9.0;10.0;12.0"
# のため Turing (sm_75) の cubin を含む。CUDA 13.x が打ち切ったのは sm_75 未満。
# explicit = true により、このインデックスは下の [tool.uv.sources] で名指しされた
# パッケージ以外の解決には一切使われない。
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# Windows 以外 (Linux/macOS) は PyPI の既定ホイールのままにする。
# Linux の PyPI torch は元から CUDA 対応、macOS は CUDA ホイール自体が無い。
# marker が無いと cu130 に macOS ホイールが存在せず universal lock が詰む。
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # allow asserts in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# RUF001 (ambiguous unicode in strings): the following files intentionally hold
# full-width Japanese punctuation (「」（）！？：，．) — either in user-facing
# prompts/messages or in regex/strip character sets that MUST contain JP forms
# alongside ASCII. Substituting ASCII would break the linguistic intent or the
# Japanese text processing. Scoped per-file so any unintended occurrence
# elsewhere still trips RUF001.
"core/generation/prompts.py" = ["RUF001"]          # JP system prompt text
"core/ingestion/chunker.py" = ["RUF001"]           # JP sentence-end regex
"core/recording/title_inference.py" = ["RUF001"]   # JP/ASCII colon separators
"core/recording/transcriber.py" = ["RUF001"]       # JP/ASCII strip char set
"core/generation/stream.py" = ["RUF001"]           # 自動継続の "N×M回" 表記
"core/mcp/tools/ask.py" = ["RUF001"]               # 同上(MCP ask の自動継続注記)
"tests/integration/test_generation.py" = ["RUF001"]  # 上記表記を検証するテスト文字列

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "ollama: tests that require a running Ollama server",
    "qdrant: tests that require Qdrant local mode write access",
    "cuda: tests that require an NVIDIA CUDA device",
    "slow: tests that exercise real model inference (>5s wall clock)",
    "pdf: tests that require the optional PyMuPDF (pdf) extra",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "core"]
